<nav class="site-nav" aria-label="Main navigation">
    <div class="site-shell nav-inner">
        <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name | escape }}</a>
        <ul class="nav-links">
            {% for item in site.data.navigation.pages %}
            <li><a href="{{ item.url | relative_url }}" {% if item.name == page.navbar_title %}aria-current="page"{% endif %}>{{ item.name | escape }}</a></li>
            {% endfor %}
        </ul>
    </div>
</nav>
