short_bio: >-
    <p>Hi! I'm Haixiang (Hanson) Tang, an undergraduate at the
    <a href="https://illinois.edu/">University of Illinois Urbana-Champaign</a>,
    studying Computer Science &amp; Mathematics with a minor in Statistics.</p>

    <p>My research interests include natural language processing, data selection, and AI agents.
    My recent work studies evidence selection for retrieval-augmented generation,
    how scientific novelty relates to recognition, and the evaluation of language model agents.
    I am currently exploring data selection for reinforcement learning post-training.</p>

    <p>I am fortunate to work with
    <a href="https://yuzhimanhua.github.io/">Prof. Yu Zhang</a> at Texas A&amp;M University.
    Previously, I worked with
    <a href="http://www.zhanglinfeng.tech/">Prof. Linfeng Zhang</a> at Shanghai Jiao Tong University
    on dataset pruning.</p>

personal_note: I enjoy jazz and classical music, anime, and ACG games.
